plugins {
    id 'java'
    id 'org.cyclonedx.bom' version '1.9.0'
}

group = "org.poornesh"
version = "1.0.0"

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.guava:guava:32.1.2-jre'
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'ch.qos.logback:logback-classic:1.4.14'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

// Configure the CycloneDX SBOM task lazily
gradle.taskGraph.whenReady { graph ->
    tasks.withType(org.cyclonedx.gradle.CycloneDxTask).configureEach { task ->
        task.includeConfigs.set(['implementation', 'runtimeClasspath'])
        task.skipConfigs.set(['testImplementation', 'testRuntimeClasspath'])
        task.projectType.set('library')
        task.outputFormat.set('json')
        task.outputLocation.set(file("$buildDir/sbom/gradle-sbom.json"))
        task.includeMetadataResolution.set(true)
        task.includeLicenseText.set(true)
        task.includeBuildSystem.set(true)
    }
}
