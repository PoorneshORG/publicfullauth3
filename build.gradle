plugins {
    id 'java'
    id 'org.cyclonedx.bom' version '1.9.0'
}

group = "org.poornesh"
version = "1.0.0"

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.guava:guava:32.1.2-jre'
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'ch.qos.logback:logback-classic:1.4.14'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

// Proper CycloneDX plugin configuration for Gradle 9+
extensions.configure(org.cyclonedx.gradle.CycloneDxPluginExtension) { ext ->
    ext.includeConfigs = ['implementation', 'runtimeClasspath']
    ext.skipConfigs = ['testImplementation', 'testRuntimeClasspath']
    ext.projectType = 'library'
    ext.outputFormat = 'json'
    ext.outputLocation = file("$buildDir/sbom/gradle-sbom.json")
    ext.includeMetadataResolution = true
    ext.includeLicenseText = true
    ext.includeBuildSystem = true
}
