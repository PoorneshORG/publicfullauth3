plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'org.cyclonedx.bom' version '1.9.0'
}

group = "org.poornesh"
version = "1.0.0"

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.guava:guava:32.1.2-jre'
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'ch.qos.logback:logback-classic:1.4.14'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

// CycloneDX SBOM task configuration
tasks.named('cyclonedxBom', org.cyclonedx.gradle.CycloneDxTask) {
    includeCompileClasspath.set(true)       // include compile-time deps
    includeRuntimeClasspath.set(true)       // include runtime deps
    includeBuildScripts.set(false)          // usually false
    outputFormat.set('json')                // generate JSON output
    outputLocation.set("$buildDir/sbom/gradle-sbom.json")
}
