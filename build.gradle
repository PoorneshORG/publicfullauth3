plugins {
    id 'java'
    id 'org.cyclonedx.bom' version '1.9.0'
}

group = "org.poornesh"
version = "1.0.0"

repositories {
    mavenCentral()
}

dependencies {
    // Main dependencies
    implementation 'com.google.guava:guava:32.1.2-jre'
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'ch.qos.logback:logback-classic:1.4.14'

    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

// CycloneDX SBOM configuration for Gradle 9+
cyclonedxBom {
    // Generate JSON format SBOM
    outputFormat = 'json'

    // Save SBOM to project root (so workflow can find sbom.json)
    outputLocation = file("${rootDir}/sbom.json")

    // Include main implementation and runtime classpath
    includeConfigs = ['implementation', 'runtimeClasspath']

    // Optional: skip test dependencies
    skipConfigs = ['testImplementation', 'testRuntimeClasspath']

    // Optional: include build system metadata
    includeBuildSystem = true

    // Optional: include license text for components
    includeLicenseText = true

    // Optional: include metadata about resolved dependencies
    includeMetadataResolution = true
}
