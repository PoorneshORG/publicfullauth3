plugins {
    id 'java'
    id 'org.cyclonedx.bom' version '1.9.0'
}

group = "org.poornesh"
version = "1.0.0"

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.guava:guava:32.1.2-jre'
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'ch.qos.logback:logback-classic:1.4.14'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

// CycloneDX SBOM configuration (Gradle 9+ compatible)
cyclonedxBom {
    includeConfigs = ['implementation', 'runtimeClasspath']
    skipConfigs = ['testImplementation', 'testRuntimeClasspath']
    projectType = 'library'
    componentGroup = project.group.toString()
    componentName = project.name
    componentVersion = project.version.toString()
    outputFormat = 'json'
    outputLocation = file("$buildDir/sbom/gradle-sbom.json")
    includeBuildSystem = true
    includeLicenseText = true
    includeMetadataResolution = true
    organizationalEntity {
        name = "PoorneshORG"
        urls = ["https://github.com/PoorneshORG"]
    }
}
