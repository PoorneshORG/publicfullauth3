name: SBOM Scan and Upload

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  sbom:
    runs-on: ubuntu-latest
    env:
      DT_URL: ${{ secrets.DEPENDENCY_TRACK_API_URL }}
      DT_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
      PROJECT_NAME: ${{ github.repository }}
      PROJECT_VERSION: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      # Setup Java (required for CycloneDX CLI)
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # Download CycloneDX CLI jar
      - name: Download CycloneDX CLI
        run: |
          C_VERSION=0.29.1
          curl -L -o cyclonedx-cli.jar \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v${C_VERSION}/cyclonedx-cli-${C_VERSION}.jar

      # Java / Maven
      - name: Generate SBOM - Java Maven
        if: hashFiles('pom.xml') != ''
        run: |
          mvn -B clean install -DskipTests
          java -jar cyclonedx-cli.jar sbom -o sbom.json --maven-target target/*.jar

      # Gradle / Kotlin
      - name: Generate SBOM - Gradle
        if: hashFiles('build.gradle*') != ''
        run: |
          ./gradlew build -x test
          java -jar cyclonedx-cli.jar gradle \
            --project-group my-org \
            --project-name my-gradle-app \
            --project-version "${PROJECT_VERSION}" \
            --output-file sbom.json

      # Node.js / React
      - name: Generate SBOM - Node.js
        if: hashFiles('package-lock.json') != '' || hashFiles('yarn.lock') != ''
        run: |
          if [ -f package-lock.json ]; then
            java -jar cyclonedx-cli.jar npm --output-file sbom.json
          elif [ -f yarn.lock ]; then
            java -jar cyclonedx-cli.jar yarn --output-file sbom.json
          fi

      # Python
      - name: Generate SBOM - Python
        if: hashFiles('requirements.txt') != '' || hashFiles('poetry.lock') != '' || hashFiles('Pipfile.lock') != ''
        run: |
          if [ -f requirements.txt ]; then
            java -jar cyclonedx-cli.jar python -r requirements.txt --output-file sbom.json
          elif [ -f poetry.lock ]; then
            java -jar cyclonedx-cli.jar python -p poetry.lock --output-file sbom.json
          elif [ -f Pipfile.lock ]; then
            java -jar cyclonedx-cli.jar python -p Pipfile.lock --output-file sbom.json
          fi

      # Flutter
      - name: Generate SBOM - Flutter
        if: hashFiles('pubspec.lock') != ''
        run: |
          java -jar cyclonedx-cli.jar flutter --output-file sbom.json

      # Debug SBOM
      - name: Debug SBOM contents
        run: |
          echo "===== SBOM JSON Preview ====="
          cat sbom.json | jq '.components[] | {name, version, purl}'

      # Create project in Dependency-Track if missing
      - name: Get or Create Project
        id: project
        run: |
          UUID=$(curl -s -H "X-Api-Key: $DT_API_KEY" \
            "$DT_URL/api/v1/project?name=$PROJECT_NAME" | jq -r '.[0].uuid // empty')
          if [ -z "$UUID" ]; then
            echo "Creating new project..."
            UUID=$(curl -s -X PUT -H "Content-Type: application/json" \
              -H "X-Api-Key: $DT_API_KEY" \
              -d '{"name":"'"$PROJECT_NAME"'","version":"'"$PROJECT_VERSION"'"}' \
              "$DT_URL/api/v1/project" | jq -r '.uuid')
          fi
          echo "uuid=$UUID" >> $GITHUB_OUTPUT

      # Upload SBOM
      - name: Upload SBOM to Dependency-Track
        run: |
          curl -s -X POST "$DT_URL/api/v1/bom" \
            -H "X-Api-Key: $DT_API_KEY" \
            -F "project=${{ steps.project.outputs.uuid }}" \
            -F "bom=@sbom.json"
