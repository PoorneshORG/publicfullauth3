name: SBOM Scan with Vet

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  sbom:
    runs-on: ubuntu-latest
    env:
      DT_URL: ${{ secrets.DEPENDENCY_TRACK_API_URL }}
      DT_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
      PROJECT_NAME: ${{ github.repository }}
      PROJECT_VERSION: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      # Run Vet to scan and generate SBOM
      - name: Run Vet
        id: vet
        uses: safedep/vet-action@v1
        with:
          # optionally point to a vet policy if you have one
          # policy: '.github/vet/policy.yml'
          upload-sarif: true
          add-step-summary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rename Vet’s SBOM output to a predictable name
      - name: Prepare SBOM
        run: |
          if [ -f vet.cdx.json ]; then
            mv vet.cdx.json sbom.json
          else
            echo "SBOM not found from Vet!"
            exit 1
          fi

      # Debug SBOM preview
      - name: Debug SBOM contents
        run: |
          echo "===== SBOM JSON Preview ====="
          cat sbom.json | jq '.components[] | {name, version, purl}' | head -n 20

      # Get or create project in Dependency-Track
      - name: Get or Create Project
        id: project
        run: |
          UUID=$(curl -s -H "X-Api-Key: $DT_API_KEY" \
            "$DT_URL/api/v1/project?name=$PROJECT_NAME" | jq -r '.[0].uuid // empty')
          if [ -z "$UUID" ]; then
            echo "Creating new project..."
            UUID=$(curl -s -X PUT -H "Content-Type: application/json" \
              -H "X-Api-Key: $DT_API_KEY" \
              -d '{"name":"'"$PROJECT_NAME"'","version":"'"$PROJECT_VERSION"'"}' \
              "$DT_URL/api/v1/project" | jq -r '.uuid')
          fi
          echo "uuid=$UUID" >> $GITHUB_OUTPUT

      # Upload SBOM to Dependency-Track
      - name: Upload SBOM to Dependency-Track
        run: |
          curl -s -X POST "$DT_URL/api/v1/bom" \
            -H "X-Api-Key: $DT_API_KEY" \
            -F "project=${{ steps.project.outputs.uuid }}" \
            -F "bom=@sbom.json"
