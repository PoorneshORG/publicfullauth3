name: Snyk SBOM + Dependency-Track

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  snyk-sbom-dtrack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Generate SBOM with Snyk
        run: |
          snyk sbom \
            --format=cyclonedx1.5+json \
            --all-projects \
            --json-file-output=sbom.json
          ls -lh sbom.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: snyk-sbom
          path: sbom.json

      - name: Upload SBOM to Dependency-Track
        env:
          DT_URL: ${{ secrets.DT_URL }}
          DT_API_KEY: ${{ secrets.DT_API_KEY }}
          PROJECT_NAME: PoorneshORG/publicfullauth3
          PROJECT_VERSION: ${{ github.sha }}
        run: |
          echo "Uploading SBOM to Dependency-Track..."
          curl -s -X POST \
            -H "X-Api-Key: $DT_API_KEY" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data-binary @sbom.json \
            "$DT_URL/api/v1/bom?projectName=$PROJECT_NAME&projectVersion=$PROJECT_VERSION"
