name: Generate SBOM
on: [push, pull_request]

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM
        uses: safedep/vet-action@v1
        with:
          scan-dir: '.'
          report-cdx: 'sbom.cdx.json'
          app-name: ${{ github.repository }}

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
