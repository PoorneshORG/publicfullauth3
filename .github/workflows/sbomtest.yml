name: SBOM Scan and Upload

on:
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  sbom:
    runs-on: ubuntu-latest
    env:
      DT_URL: ${{ secrets.DEPENDENCY_TRACK_API_URL }}
      DT_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
      PROJECT_NAME: ${{ github.repository }}
      PROJECT_VERSION: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      # Install fixed Syft version
      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
          | sh -s -- -b /usr/local/bin v1.29.0

      # Java / Spring (Maven)
      - name: Generate SBOM - Java Maven
        if: hashFiles('pom.xml') != ''
        run: |
          mvn -B clean install -DskipTests
          syft target/*.jar -o cyclonedx-json > sbom-maven.json

      # Gradle / Kotlin
      - name: Generate SBOM - Gradle
        if: hashFiles('build.gradle*') != ''
        run: |
          ( [ -f ./gradlew ] && ./gradlew build -x test || gradle build -x test )
          syft build/libs/*.jar -o cyclonedx-json > sbom-gradle.json

      # Node.js / React
      - name: Generate SBOM - Node.js
        if: hashFiles('package-lock.json') != '' || hashFiles('yarn.lock') != ''
        run: |
          if [ -f package-lock.json ]; then
            syft package-lock.json -o cyclonedx-json > sbom-node.json
          elif [ -f yarn.lock ]; then
            syft yarn.lock -o cyclonedx-json > sbom-node.json
          fi

      # Python
      - name: Generate SBOM - Python
        if: hashFiles('requirements.txt') != '' || hashFiles('poetry.lock') != '' || hashFiles('Pipfile.lock') != ''
        run: |
          if [ -f requirements.txt ]; then
            syft requirements.txt -o cyclonedx-json > sbom-python.json
          elif [ -f poetry.lock ]; then
            syft poetry.lock -o cyclonedx-json > sbom-python.json
          elif [ -f Pipfile.lock ]; then
            syft Pipfile.lock -o cyclonedx-json > sbom-python.json
          fi

      # Flutter
      - name: Generate SBOM - Flutter
        if: hashFiles('pubspec.lock') != ''
        run: syft pubspec.lock -o cyclonedx-json > sbom-flutter.json

      # Merge SBOMs
      - name: Merge SBOMs
        run: |
          FILES=$(ls sbom-*.json 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "No SBOMs generated!"
            exit 1
          fi
          if [ $(echo $FILES | wc -w) -eq 1 ]; then
            cp $FILES sbom.json
          else
            jq -s '{"bomFormat":"CycloneDX","specVersion":"1.4","version":1,"components": (map(.components) | add)}' $FILES > sbom.json
          fi

      # Debug SBOM.json
      - name: Debug SBOM contents
        run: |
          echo "===== SBOM JSON Preview ====="
          cat sbom.json | jq '.components[] | {name, version, purl}' | head -n 20

      # Create project in Dependency-Track if missing
      - name: Get or Create Project
        id: project
        run: |
          UUID=$(curl -s -H "X-Api-Key: $DT_API_KEY" \
            "$DT_URL/api/v1/project?name=$PROJECT_NAME" | jq -r '.[0].uuid // empty')

          if [ -z "$UUID" ]; then
            echo "Creating new project..."
            UUID=$(curl -s -X PUT -H "Content-Type: application/json" \
              -H "X-Api-Key: $DT_API_KEY" \
              -d '{"name":"'"$PROJECT_NAME"'","version":"'"$PROJECT_VERSION"'"}' \
              "$DT_URL/api/v1/project" | jq -r '.uuid')
          fi

          echo "uuid=$UUID" >> $GITHUB_OUTPUT

      # Upload SBOM
      - name: Upload SBOM to Dependency-Track
        run: |
          curl -s -X POST "$DT_URL/api/v1/bom" \
            -H "X-Api-Key: $DT_API_KEY" \
            -F "project=${{ steps.project.outputs.uuid }}" \
            -F "bom=@sbom.json"
