name: Generate SBOM with cdxgen

on:
  push:
  pull_request:

jobs:
  generate-sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Install cdxgen
        run: |
          curl -sL https://github.com/CycloneDX/cdxgen/releases/latest/download/cdxgen-cli.jar -o /usr/local/bin/cdxgen
          chmod +x /usr/local/bin/cdxgen

      - name: Generate SBOM
        run: |
          cdxgen -r -o bom.json
          cdxgen -p
