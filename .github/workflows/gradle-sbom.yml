name: Generate SBOM

on:
  push:

  pull_request:


jobs:
  sbom:
    runs-on: ubuntu-latest
    env:
      DT_URL: ${{ secrets.DEPENDENCY_TRACK_API_URL }}
      DT_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
      PROJECT_NAME: ${{ github.repository }}
      PROJECT_VERSION: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      # Setup Java 21 for Maven/Gradle detection
      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      # Generate SBOM using CycloneDX Action
      - name: Generate SBOM
        uses: CycloneDX/cdxgen-action@v1
        with:
          projectName: ${{ env.PROJECT_NAME }}
          projectVersion: ${{ env.PROJECT_VERSION }}
          output: sbom.json
          serverUrl: ${{ env.DT_URL }}
          apiKey: ${{ env.DT_API_KEY }}

      # Debug SBOM
      - name: Debug SBOM contents
        run: |
          echo "===== SBOM JSON Preview ====="
          cat sbom.json | jq '.components[] | {name, version, purl}'
