name: Generate and Upload SBOM

on:
  push:
  pull_request:

jobs:
  sbom:
    runs-on: ubuntu-latest
    env:
      DT_URL: ${{ secrets.DEPENDENCY_TRACK_API_URL }}
      DT_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
      PROJECT_NAME: ${{ github.repository }}
      PROJECT_VERSION: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      # Generate SBOM using CycloneDX Docker image (all languages)
      - name: Generate SBOM using Docker
        run: |
          echo "Generating SBOM using CycloneDX Docker image..."
          docker run --rm \
            -v /tmp:/tmp \
            -v $PWD:/app:rw \
            -t ghcr.io/cyclonedx/cdxgen \
            -r /app \
            -o /app/sbom.json
          echo "===== SBOM JSON Preview ====="
          docker run --rm \
            -v /tmp:/tmp \
            -v $PWD:/app:rw \
            -t ghcr.io/cyclonedx/cdxgen \
            -p /app/sbom.json

      # Upload SBOM artifact for download
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      # Get or create project in Dependency-Track
      - name: Get or Create Project
        id: project
        run: |
          UUID=$(curl -s -H "X-Api-Key: $DT_API_KEY" \
            "$DT_URL/api/v1/project?name=$PROJECT_NAME" | jq -r '.[0].uuid // empty')

          if [ -z "$UUID" ]; then
            echo "Creating new project..."
            UUID=$(curl -s -X PUT -H "Content-Type: application/json" \
              -H "X-Api-Key: $DT_API_KEY" \
              -d '{"name":"'"$PROJECT_NAME"'","version":"'"$PROJECT_VERSION"'"}' \
              "$DT_URL/api/v1/project" | jq -r '.uuid')
          fi

          echo "uuid=$UUID" >> $GITHUB_OUTPUT

      # Upload SBOM to Dependency-Track
      - name: Upload SBOM to Dependency-Track
        run: |
          curl -s -X POST "$DT_URL/api/v1/bom" \
            -H "X-Api-Key: $DT_API_KEY" \
            -F "project=${{ steps.project.outputs.uuid }}" \
            -F "bom=@sbom.json"
