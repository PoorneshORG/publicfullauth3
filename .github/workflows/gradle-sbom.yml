name: Generate SBOM with cdxgen

on:
  push:
  pull_request:

jobs:
  generate-sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Install cdxgen CLI
        run: |
          curl -sSL https://github.com/CycloneDX/cdxgen/releases/latest/download/cdxgen-cli.jar -o cdxgen-cli.jar

      - name: Generate SBOM
        run: |
          java -jar cdxgen-cli.jar -t java -o bom.json
          java -jar cdxgen-cli.jar -p
