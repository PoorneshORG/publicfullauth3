name: Generate SBOM with cdxgen

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  generate-sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'

      - name: Install cdxgen
        run: |
          curl -sSL https://github.com/CycloneDX/cdxgen/releases/latest/download/cdxgen-standalone.jar -o cdxgen.jar

      - name: Generate SBOM
        run: |
          java -jar cdxgen.jar -r -o sbom.json
          cat sbom.json
