name: Generate SBOM with cdxgen

on:
  push:
  pull_request:

jobs:
  generate-sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Generate SBOM
        uses: CycloneDX/cdxgen-action@v1
        with:
          output-file: bom.json
          recursive: true
          print-table: true
